<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f3"><title>红峰勤家常小餐馆</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f3;color:#613b30;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fffaf6ee;backdrop-filter:blur(12px);border-bottom:1px solid #f4d9cf;padding:13px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900;color:#9b5038}.brand small{display:block;font-size:10px;font-weight:500;color:#c88f7b}.cartJump{border:0;border-radius:16px;padding:11px 15px;background:#ffe6e4;color:#a14c45;font-weight:800}.hero{width:min(1120px,92%);margin:22px auto;background:linear-gradient(135deg,#ffe8df,#fff3d9);border-radius:28px;padding:34px;box-shadow:0 12px 35px #9d624b18}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#906e61}.wrap{width:min(1120px,92%);margin:auto;display:grid;grid-template-columns:1fr 300px;gap:20px}.section{margin:8px 0 30px}.section h2{font-size:24px}.tag{font-size:12px;background:#ffe7e2;padding:6px 10px;border-radius:99px;color:#a75a4e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid #f2dcd3;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #a56a4a12}.pic{height:120px;display:grid;place-items:center;background:linear-gradient(145deg,#fff1e7,#ffe3e1)}.pic span{font-size:67px;filter:drop-shadow(0 6px 7px #9f6c5522)}.body{padding:13px}.body h3{margin:0 0 4px}.body p{margin:0 0 11px;font-size:12px;color:#a17c70}.add{width:100%;border:0;border-radius:12px;padding:10px;background:#ff8792;color:white;font-weight:800;cursor:pointer;touch-action:manipulation}aside{position:sticky;top:80px;height:max-content;background:#fff;border:1px solid #f2dcd3;border-radius:24px;padding:18px;box-shadow:0 10px 30px #9d624b16}.empty{text-align:center;background:#fff5f0;border-radius:17px;padding:28px 8px;color:#ad8a7c}.item{padding:12px 0;border-bottom:1px dashed #efd8ce;display:flex;justify-content:space-between;align-items:center}.qty{display:flex;gap:7px;align-items:center}.qty button{border:0;background:#fff0ea;border-radius:9px;width:29px;height:29px;font-size:17px;color:#74493b}.summary{margin-top:14px;background:#fff0ef;padding:13px;border-radius:15px;font-weight:800}.clear{width:100%;margin-top:10px;border:1px solid #efc8bf;background:white;border-radius:11px;padding:9px;color:#9d5b4e}.toast{position:fixed;z-index:20;bottom:25px;left:50%;transform:translate(-50%,80px);opacity:0;background:#624237;color:white;border-radius:99px;padding:11px 17px;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{position:static}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.hero{padding:24px}.hero h1{font-size:28px}.grid{gap:9px}.pic{height:95px}.pic span{font-size:53px}.body{padding:10px}.add{font-size:12px}}
</style></head><body>
<div class="top"><div class="brand">🏠 红峰勤家常小餐馆<small>HONG FENG QIN · FAMILY KITCHEN</small></div><button class="cartJump" id="jump">🛒 今晚菜单 <span id="badge">0</span></button></div>
<div class="hero"><h1>欢迎光临红峰勤家常小餐馆 ♡</h1><p>像在饭店点菜一样，挑几道今天想吃的吧～</p></div>
<div class="wrap"><main><div class="section"><h2>☀️ 早餐 <span class="tag">元气满满</span></h2><div class="grid" id="breakfast"></div></div><div class="section"><h2>🌙 午晚餐 <span class="tag">家的味道</span></h2><div class="grid" id="dinner"></div></div></main>
<aside id="cartBox"><h2>🛒 今晚菜单</h2><p style="font-size:12px;color:#a07d70">点“加入菜单”后会出现在这里。</p><div id="cart"></div><div id="summary"></div><button class="clear" id="clear">清空菜单</button></aside></div><div class="toast" id="toast">已经加入今晚菜单啦 ♡</div>
<script>
const foods={breakfast:[["🥓","培根","香香脆脆"],["🍳","煎鸡蛋","元气早餐"],["🍞","烤面包片","外脆里软"],["🌶️","老干妈","万能搭配"],["🍜","面条","热乎乎"],["🥣","疙瘩汤","家的味道"],["🌭","肉肠","煎一煎更香"]],dinner:[["🍛","咖喱牛肉","浓郁下饭"],["🍅","番茄牛腩","酸甜软烂"],["🥔","炒土豆丝","清脆爽口"],["🥒","丝瓜炒鸡蛋","清爽家常"],["🦑","笔管","鲜香海味"],["🐚","蛤蜊","鲜甜多汁"],["🦀","螃蟹","今天吃点好的"],["🐚","鸟贝","鲜嫩爽口"],["🍅","凉拌西红柿","清凉酸甜"],["🥬","拌莴苣","脆爽开胃"],["🥣","菠菜粉丝汤","暖暖一碗"]]};
let cart={};try{cart=JSON.parse(localStorage.getItem("homeMenuV2")||"{}")||{}}catch(e){}
function makeCards(type){document.getElementById(type).innerHTML=foods[type].map(x=>'<article class="card"><div class="pic"><span>'+x[0]+'</span></div><div class="body"><h3>'+x[1]+'</h3><p>'+x[2]+'</p><button class="add" data-name="'+x[1]+'" data-emoji="'+x[0]+'">＋ 加入今晚菜单</button></div></article>').join("")}
function persist(){try{localStorage.setItem("homeMenuV2",JSON.stringify(cart))}catch(e){}render()}
function add(n,e){if(!cart[n])cart[n]={q:0,e:e};cart[n].q++;persist();const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),900)}
function change(n,d){if(!cart[n])return;cart[n].q+=d;if(cart[n].q<=0)delete cart[n];persist()}
function render(){const ks=Object.keys(cart),total=ks.reduce((s,k)=>s+cart[k].q,0);document.getElementById("badge").textContent=total;document.getElementById("cart").innerHTML=ks.length?ks.map(k=>'<div class="item"><div>'+cart[k].e+' <b>'+k+'</b></div><div class="qty"><button data-change="-1" data-name="'+k+'">−</button><b>'+cart[k].q+'</b><button data-change="1" data-name="'+k+'">＋</button></div></div>').join(""):'<div class="empty">🐱<br><br>还没有点菜哦<br>看看今天想吃什么吧～</div>';document.getElementById("summary").innerHTML=ks.length?'<div class="summary">共 '+ks.length+' 道菜 · '+total+' 份 ♡</div>':""}
makeCards("breakfast");makeCards("dinner");document.addEventListener("click",e=>{const a=e.target.closest(".add");if(a){add(a.dataset.name,a.dataset.emoji);return}const q=e.target.closest("[data-change]");if(q)change(q.dataset.name,Number(q.dataset.change))});document.getElementById("clear").onclick=()=>{cart={};persist()};document.getElementById("jump").onclick=()=>document.getElementById("cartBox").scrollIntoView({behavior:"smooth"});render();
</script></body></html>
